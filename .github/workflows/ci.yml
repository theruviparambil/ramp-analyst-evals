name: ci

# Offline gate: typecheck + the full test suite, keyless. The eval gate
# (npm run eval) is separate: it needs an LLM key to generate trajectories and
# runs on demand, not here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm test
